[project]
name = "olist-crewai-flow"
version = "0.1.0"
description = "CrewAI Flow that hands off from a Data Analyst crew to a Data Scientist crew to predict late deliveries on the Olist e-commerce dataset"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
authors = [{ name = "matanelsh" }]
dependencies = [
    "crewai[google-genai]==1.14.5",
    "pandas>=2.3,<2.4",
    "numpy>=2.3,<2.4",
    "scikit-learn==1.7.2",
    "matplotlib>=3.10,<3.11",
    "seaborn>=0.13,<0.14",
    "joblib>=1.5,<2",
    "threadpoolctl>=3.5",
    "flask>=3.1,<3.2",
    "waitress>=3.0,<4",
    "python-dotenv>=1.1",
    "requests>=2.32",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-timeout>=2.3",
    "ruff>=0.12,<0.13",
]
# Slim set exported to app/requirements.txt for Streamlit Community Cloud (no crewai).
app = [
    "streamlit>=1.51,<1.52",
    "pandas>=2.3,<2.4",
    "numpy>=2.3,<2.4",
    "scikit-learn==1.7.2",
    "joblib>=1.5,<2",
    "requests>=2.32",
]

[project.scripts]
kickoff = "olist_flow.run:kickoff"
plot = "olist_flow.run:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olist_core", "src/olist_flow"]

[tool.crewai]
type = "flow"

[tool.uv]
default-groups = ["dev", "app"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# The formatter enforces line length for code; long user-facing strings are allowed.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "llm: live Gemini tests (deselected by default)",
    "slow: full-data runs (deselected by default)",
]
addopts = "-m 'not llm and not slow' --timeout=300 --timeout-method=thread"
