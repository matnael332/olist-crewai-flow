ingest_clean_task:
  description: >-
    Run {run_id}, dataset {dataset_name}. Call the ingest_and_clean tool exactly once. It returns
    the profile of the raw tables and the cleaning report (every rule with the rows it removed).
  expected_output: >-
    The JSON report returned by the tool.
  agent: data_engineer
  context: []

cleaning_narrative_task:
  description: >-
    Using the cleaning report from the previous task, document the data cleaning for business
    readers: the quality issues found (with exact counts), the decisions taken and why, and the
    caveats that remain. Quote only numbers that appear in the report.
    Rates in the JSON are already formatted as percentages (for example 6.8%): copy them
    exactly and never recompute them. Write counts with thousands separators.
    Write every text field in {language}; keep column names, feature names and numbers exactly
    as they appear in the JSON.
  expected_output: >-
    A CleaningNarrative with summary, issues_found, decisions and caveats.
  agent: cleaning_documenter
  context: [ingest_clean_task]

eda_task:
  description: >-
    Call the run_eda tool exactly once. It returns the computed EDA summary: key numbers, the
    {target_label} rate of the {entity} population and the breakdowns the analysis produced.
  expected_output: >-
    The JSON summary returned by the tool.
  agent: eda_analyst
  context: []

insights_task:
  description: >-
    Using the EDA summary from the previous task, explain what happened in the {dataset_name}
    business. Say which population a rate is measured on whenever you quote the {target_label}
    rate. Give 4 to 6 key findings with the exact numbers as evidence, 3 to 5 recommendations,
    data caveats and implications for modeling. Every number must appear in the summary;
    recommendations must not introduce new numbers or thresholds.
    Rates in the JSON are already formatted as percentages (for example 6.8%): copy them
    exactly and never recompute them. Write counts with thousands separators.
    Write every text field in {language}; keep column names, feature names and numbers exactly
    as they appear in the JSON.
  expected_output: >-
    An Insights object with headline, key_findings, recommendations, data_caveats and
    modeling_implications.
  agent: insights_writer
  context: [eda_task]

contract_task:
  description: >-
    Call the draft_contract_schema tool exactly once. It returns the machine-generated part of the
    dataset contract: schema, constraints, target definition, split policy, required and forbidden
    features.
  expected_output: >-
    The JSON contract draft returned by the tool.
  agent: data_steward
  context: []

contract_narrative_task:
  description: >-
    Review the contract draft and the cleaning report from previous tasks and write the human part
    of the dataset contract that the Data Scientist crew must follow: assumptions, business rules,
    notes on specific columns (use exact column names from the draft) and known limitations. In the
    column notes, explain which columns are known at decision time and which are forbidden as
    features because they only exist afterwards.
    Rates in the JSON are already formatted as percentages (for example 6.8%): copy them
    exactly and never recompute them.
    Write every text field in {language}; keep column names, feature names and numbers exactly
    as they appear in the JSON.
  expected_output: >-
    A ContractNarrative with assumptions, business_rules, column_notes and known_limitations.
  agent: contract_author
  context: [ingest_clean_task, contract_task]
