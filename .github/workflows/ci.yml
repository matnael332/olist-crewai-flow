name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"
  OMP_NUM_THREADS: "2"
  CREWAI_DISABLE_TELEMETRY: "true"
  OTEL_SDK_DISABLED: "true"
  CREWAI_TRACING_ENABLED: "false"
  CREWAI_TESTING: "true"
  MPLBACKEND: Agg

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Install Python (from .python-version)
        run: uv python install
      - name: Sync dependencies (locked)
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests (no LLM calls)
        run: uv run pytest -q
      - name: Repository hygiene (secrets, file sizes)
        run: uv run python scripts/check_repo_hygiene.py


  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUSTOMER: /srv/pulse/customers/demo
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker compose build
      - name: Synthetic data for the demo customer
        run: docker compose run --rm job synth --data-dir "$CUSTOMER/data"
      - name: Full pipeline run inside the image (deterministic, promotes)
        run: >-
          docker compose run --rm job python -m pulse_flow.run --no-llm
          --spec pulse_specs.workforce_saas.spec:SPEC
          --data-dir "$CUSTOMER/data" --runs-dir "$CUSTOMER/runs" --artifacts-dir "$CUSTOMER/artifacts"
      - name: Dashboard and API start healthy on the promoted model
        run: |
          docker compose up -d --wait --wait-timeout 120 dashboard api
          curl -fsS http://127.0.0.1:8501/_stcore/health
          curl -fsS http://127.0.0.1:8000/health | python3 -c '
          import json, sys
          health = json.load(sys.stdin)
          print(health["status"], health.get("model"), health.get("reason", ""))
          sys.exit(health["status"] != "ok")'
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down -v
