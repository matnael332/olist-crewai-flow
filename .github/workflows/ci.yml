name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"
  OMP_NUM_THREADS: "2"
  CREWAI_DISABLE_TELEMETRY: "true"
  OTEL_SDK_DISABLED: "true"
  CREWAI_TRACING_ENABLED: "false"
  CREWAI_TESTING: "true"
  MPLBACKEND: Agg

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Install Python (from .python-version)
        run: uv python install
      - name: Sync dependencies (locked)
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests (no LLM calls)
        run: uv run pytest -q
      - name: frontend/requirements.txt matches uv.lock and never installs crewai
        run: |
          uv export --locked --only-group frontend --no-emit-project --no-hashes --no-header \
            --format requirements.txt -o "$RUNNER_TEMP/app-requirements.txt"
          diff "$RUNNER_TEMP/app-requirements.txt" frontend/requirements.txt
          if grep -nE '^-e |crewai' frontend/requirements.txt; then
            echo "frontend/requirements.txt must not install the project or crewai"; exit 1
          fi
      - name: Repository hygiene (secrets, file sizes)
        run: uv run python scripts/check_repo_hygiene.py

  verify-artifacts:
    name: verify-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Sync dependencies (locked)
        run: uv sync --locked --all-groups
      - name: Run the three gates on the committed artifacts
        run: uv run python -m olist_core.validate artifacts

  verify-repro:
    name: verify-repro
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Sync dependencies (locked)
        run: uv sync --locked --all-groups
      - name: Two fresh runs with different hash seeds must produce identical artifacts
        run: uv run python -m olist_flow.run verify-repro --data-dir backend/tests/fixtures/olist_mini --runs-dir "$RUNNER_TEMP/runs"
